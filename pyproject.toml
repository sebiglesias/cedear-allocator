[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cedear-allocator"
version = "0.1.0"
description = "CLI para optimizar la asignación mensual de sueldo a CEDEARs (SPY, VEA, IEMG) en el mercado argentino."
readme = "README.md"
authors = [
  { name = "Sebastian Iglesias" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cedear-allocator = "cedear_allocator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
